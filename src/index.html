<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foglio gara · Anteprima multi-squadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EEF2EF; --paper:#FFFFFF; --ink:#15202B; --muted:#5B6875; --line:#D5DDD8;
  --grass:#2F6B45; --grass-soft:#E3EFE6; --grass-2:#D8E9DD; --red:#C8102E; --amber:#E3A008;
  --sel:#1F5FA8;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1612;--paper:#18211C;--ink:#E7EEE9;--muted:#9AABA1;--line:#2B3830;--grass-soft:#1C2A21;--grass-2:#22332A;--grass:#7FC196;--sel:#6FA8E8}
}
:root[data-theme="dark"]{--bg:#0F1612;--paper:#18211C;--ink:#E7EEE9;--muted:#9AABA1;--line:#2B3830;--grass-soft:#1C2A21;--grass-2:#22332A;--grass:#7FC196;--sel:#6FA8E8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.brand{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:0}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font-family:var(--cond);font-weight:600;font-size:18px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--grass)}
main{max-width:1000px;margin:0 auto;padding:16px 16px 80px}
h2{font-family:var(--cond);font-weight:700;font-size:26px;margin:0 0 4px;line-height:1.1}
h3{font-family:var(--cond);font-weight:600;font-size:20px;margin:22px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:62ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel + .panel{margin-top:14px}
input[type=text],input[type=date],input[type=time],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn.primary{background:var(--grass);border-color:var(--grass);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1612}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1612}}
.btn.ghost{background:none}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Rosa */
.prow{display:grid;grid-template-columns:64px 1fr 40px;gap:8px;margin-bottom:8px;align-items:center}
.prow .num{text-align:center;font-family:var(--cond);font-weight:700;font-size:20px}
.prow .num.missing{border-color:var(--amber)}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:20px}
.iconbtn:hover{background:var(--bg)}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600}
/* Chips */
.tray{display:flex;flex-wrap:wrap;gap:6px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px 5px 5px;display:inline-flex;align-items:center;gap:7px;cursor:grab;font-size:14px;font-weight:500;min-height:36px}
.chip b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--cond);font-size:16px;padding:0 4px}
.chip.used{opacity:.5}
.chip.bench b{background:var(--grass)}
.chip.selected{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.ghost-chip{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-120%);box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* Formazione board */
.formwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:820px){.formwrap{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass-soft) 0 8.33%,var(--grass-2) 8.33% 16.66%);border:2px solid var(--grass)}
.pitch .ln{position:absolute;border:2px solid var(--grass);opacity:.55}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:80px}
.slot .disc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:20px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.slot.empty .disc{background:transparent;color:var(--ink);border:2px dashed var(--ink);box-shadow:none;opacity:.65}
.slot .pname{font-size:12px;font-weight:700;line-height:1.1;text-align:center;background:var(--paper);padding:1px 5px;border-radius:5px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sn{position:absolute;top:-6px;right:14px;font-size:10px;font-weight:700;background:var(--paper);color:var(--muted);border-radius:6px;padding:0 4px;border:1px solid var(--line)}
.slot.hot .disc{box-shadow:0 0 0 3px var(--sel)}
.slot .x{position:absolute;top:-8px;left:12px;width:20px;height:20px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0}
/* Schemi */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:4px}
.scard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper)}
.scard.sel{border-color:var(--grass);box-shadow:0 0 0 2px var(--grass) inset}
.scardmain{display:block;width:100%;position:relative;border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.scardmain:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:8px}
.sthumb{width:100%;aspect-ratio:60/34;border-radius:8px;display:block;background:var(--grass-soft)}
.chk2{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;background:rgba(21,32,43,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.scard.sel .chk2{background:var(--grass)}
.stitle{display:block;font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.15;margin-top:8px}
.ssub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sassign{margin-top:8px;min-height:42px}
.sassign .note{font-size:12px;margin:0}
.side{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.side.favore{background:#DDF0E2;color:#1E5A36}.side.sfavore{background:#F8DDE1;color:#8E0C22}
.chk{width:22px;height:22px;accent-color:var(--grass)}
.board{width:100%;display:block;border-radius:10px;border:2px solid var(--grass);background:var(--grass-soft);touch-action:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.tokpanel{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:12px}
/* PDF */
.pages{display:grid;gap:14px;margin-top:14px}
.pages canvas{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
.note{font-size:14px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
/* Multi-squadra */
.demo{background:#15202B;color:#E7EEE9;font-size:13px}
.demo .in{max-width:1000px;margin:0 auto;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo .tagd{font-family:var(--cond);font-weight:700;letter-spacing:.08em;font-size:13px;background:var(--amber);color:#15202B;padding:1px 8px;border-radius:5px}
.demo select{width:auto;min-height:32px;padding:3px 8px;background:#243241;color:#fff;border:1px solid #3a4a5a;border-radius:7px}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.ctx select{width:auto;min-height:32px;padding:3px 8px;font-weight:600}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.badge.admin{background:var(--ink);color:var(--paper)} .badge.coach{background:var(--grass);color:#fff}
.teamname{font-family:var(--cond);font-weight:600;font-size:18px}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--grass-soft);border:1px solid var(--grass-2);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.lock svg{flex:none;margin-top:2px}
.ro-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ro-row:last-child{border-bottom:0}
.ro-row .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--cond);font-weight:700;font-size:17px}
.ro-row .nm{font-weight:600}
.cols2{columns:2 240px;column-gap:28px}
.teamcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--paper)}
.teamcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.teamcard .hd strong{font-family:var(--cond);font-size:21px;font-weight:700}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;background:var(--bg);padding:4px 9px;border-radius:6px;border:1px solid var(--line);letter-spacing:.05em}
.stat{font-size:13px;color:var(--muted)}
.rolebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.rolebox div{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.rolebox b{font-family:var(--cond);font-size:17px;display:block;margin-bottom:4px}
.ro-field{padding:8px 0}
.ro-field .v{font-weight:600}
</style>
</head>
<body>
<div class="top">
  <div class="demo" id="demo"></div>
  <div class="bar">
    <div><div class="brand" id="brand">Foglio gara<small id="matchline">Nuova partita</small></div><div class="ctx" id="ctx"></div></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>
<main id="view"></main>

<script>
/* ---------- Dati di base ---------- */
const FORMATIONS = {
  "1-4-4-2":   [[1,50,92],[2,86,73],[5,62,77],[6,38,77],[3,14,73],[7,86,48],[8,62,52],[4,38,52],[11,14,48],[9,62,22],[10,38,22]],
  "1-4-4-1-1": [[1,50,92],[2,86,73],[5,62,77],[6,38,77],[3,14,73],[7,86,54],[8,62,58],[4,38,58],[11,14,54],[10,50,35],[9,50,15]],
  "1-4-3-3":   [[1,50,92],[2,86,73],[5,62,77],[6,38,77],[3,14,73],[8,30,54],[4,50,60],[10,70,54],[7,84,26],[9,50,17],[11,16,26]],
  "1-4-2-3-1": [[1,50,92],[2,86,73],[5,62,77],[6,38,77],[3,14,73],[4,38,60],[8,62,60],[7,84,38],[10,50,36],[11,16,38],[9,50,15]],
  "1-4-3-1-2": [[1,50,92],[2,86,73],[5,62,77],[6,38,77],[3,14,73],[8,26,56],[4,50,60],[7,74,56],[10,50,38],[9,62,17],[11,38,17]],
  "1-3-5-2":   [[1,50,92],[2,72,76],[5,50,80],[6,28,76],[7,88,48],[8,66,54],[4,50,60],[10,34,54],[3,12,48],[9,62,20],[11,38,20]],
  "1-3-4-3":   [[1,50,92],[2,72,76],[5,50,80],[6,28,76],[7,88,52],[8,62,56],[4,38,56],[3,12,52],[10,82,24],[9,50,17],[11,18,24]],
  "1-3-4-2-1": [[1,50,92],[2,72,76],[5,50,80],[6,28,76],[7,88,54],[8,62,58],[4,38,58],[3,12,54],[10,64,33],[11,36,33],[9,50,15]],
  "1-5-3-2":   [[1,50,92],[2,90,66],[4,68,78],[5,50,80],[6,32,78],[3,10,66],[7,74,50],[8,50,54],[10,26,50],[9,62,20],[11,38,20]]
};
const ROLE_COLORS = ['#C8102E','#1F5FA8','#D98E04','#2E7D4F','#6B3FA0','#0F8A8A','#A34A1E','#4A5563','#B8336A'];
const BASES = {
  'angolo-favore':  {name:'Angolo a favore', side:'favore', ball:{x:33.3,y:0.7}},
  'angolo-sfavore': {name:'Angolo a sfavore', side:'sfavore', ball:{x:33.3,y:0.7}},
  'punizione-favore':{name:'Punizione a favore', side:'favore', ball:{x:12,y:26}},
  'punizione-sfavore':{name:'Punizione a sfavore', side:'sfavore', ball:{x:12,y:26}},
  'libero':{name:'Nuovo schema', side:'favore', ball:{x:0,y:30}}
};
function defaultSheet(){return {team:'',opponent:'',date:'',time:'',venue:'',category:'',formation:'1-4-4-1-1',lineup:{},bench:[],captain:'',vice:'',notes:'',selected:[],overrides:{}}}

let S = {teams:[], players:[], schemes:[], sheet:defaultSheet()};
/* Ruoli: 'admin' vede tutto e modifica rose, schemi e squadre; 'coach' vede solo la sua squadra */
let ROLE = 'admin', curTeam = null, hashLocked = false, unsubs = [];
const isAdmin = () => ROLE === 'admin';
const TEAM = () => S.teams.find(t => t.id === curTeam);
const teamLabel = () => S.sheet.team || TEAM()?.name || 'Noi';
const LOCK_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function lockNote(t){ return `<div class="lock">${LOCK_ICON}<div>${t}</div></div>`; }
function genCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=a[Math.floor(Math.random()*a.length)]; return c.slice(0,3)+'-'+c.slice(3); }
let tab = 'squadre', selectedPlayer = null, openSchemeId = null, moveMode = false, selectedToken = null;
let db = null, downloads = null;
const pending = {}; const timers = {};

/* ---------- Utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const P = id => S.players.find(p => p.id === id);
function fmtDate(d){ if(!d) return ''; const [y,m,g] = d.split('-'); return g ? `${g}/${m}/${y}` : d; }
function surname(n){ return (n||'').trim(); }
function setStatus(t){ $('#status').textContent = t; }

/* ---------- Salvataggio ---------- */
/* Condivisi: shared/teams, shared/schemes. Per squadra: roster/<id>, sheet/<id> */
function docPath(name, team=curTeam){ return (name==='teams'||name==='schemes') ? 'shared/'+name : name+'/'+team; }
function payload(name){
  if(name==='teams') return {items:S.teams};
  if(name==='roster') return {players:S.players};
  if(name==='schemes') return {items:S.schemes};
  return clone(S.sheet);
}
function save(name){
  if(!isAdmin() && name!=='sheet') return;           // i mister scrivono solo il proprio foglio gara
  if(name!=='teams' && name!=='schemes' && !curTeam) return;
  const path = docPath(name), data = clone(payload(name));
  pending[path] = true; setStatus('Salvataggio…');
  clearTimeout(timers[path]);
  timers[path] = setTimeout(async () => {
    try{
      if(db) await db.doc(path).set(data);
      else { try{ localStorage.setItem('fg:'+path, JSON.stringify(data)); }catch(e){} }
      setStatus('Salvato');
    }catch(e){ setStatus('Non salvato: riprova'); }
    setTimeout(()=>{ pending[path] = false; }, 400);
  }, 600);
}
function applyDoc(name, data){
  if(!data) return;
  if(name==='teams') S.teams = clone(data.items || []);
  else if(name==='roster') S.players = clone(data.players || []);
  else if(name==='schemes') S.schemes = clone(data.items || []);
  else S.sheet = Object.assign(defaultSheet(), clone(data));
}
function resolveAccess(){
  const m = (location.hash||'').match(/squadra=([\w-]+)/i);
  if(m){
    const t = S.teams.find(t => (t.code||'').toLowerCase() === m[1].toLowerCase());
    if(t){ ROLE = 'coach'; curTeam = t.id; hashLocked = true; return; }
  }
  if(!curTeam || !TEAM()) curTeam = S.teams[0]?.id || null;
}
function subscribeTeam(){
  unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
  S.players = []; S.sheet = defaultSheet();
  if(curTeam){
    if(db){
      ['roster','sheet'].forEach(n => {
        const path = docPath(n);
        unsubs.push(db.doc(path).onSnapshot(snap => {
          if(pending[path]) return;
          if(snap.exists){ applyDoc(n, snap.data()); render(); }
        }, () => setStatus('Sincronizzazione in pausa')));
      });
    } else {
      ['roster','sheet'].forEach(n => { try{ const v = localStorage.getItem('fg:'+docPath(n)); if(v) applyDoc(n, JSON.parse(v)); }catch(e){} });
    }
  }
  render();
}
function switchView(role, team){
  ROLE = role; if(team) curTeam = team;
  if(!TEAM()) curTeam = S.teams[0]?.id || null;
  openSchemeId = null; moveMode = false; selectedToken = null; selectedPlayer = null;
  tab = isAdmin() ? 'squadre' : 'formazione';
  subscribeTeam(); window.scrollTo(0,0);
}
async function initStore(){
  try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){ db = null; }
  try{ if(window.claude && window.claude.use) downloads = await window.claude.use('downloads'); }catch(e){ downloads = null; }
  if(db){
    let first = true;
    db.doc('shared/schemes').onSnapshot(snap => { if(pending['shared/schemes']) return; if(snap.exists){ applyDoc('schemes', snap.data()); render(); } }, () => setStatus('Sincronizzazione in pausa'));
    db.doc('shared/teams').onSnapshot(snap => {
      if(pending['shared/teams']) return;
      if(snap.exists) applyDoc('teams', snap.data());
      const before = curTeam, beforeRole = ROLE; resolveAccess();
      if(first){ first = false; if(ROLE==='coach') tab = 'formazione'; subscribeTeam(); }
      else if(before !== curTeam || beforeRole !== ROLE) subscribeTeam();
      else render();
    }, () => setStatus('Sincronizzazione in pausa'));
    setStatus('Sincronizzato');
  } else {
    ['teams','schemes'].forEach(n => { try{ const v = localStorage.getItem('fg:shared/'+n); if(v) applyDoc(n, JSON.parse(v)); }catch(e){} });
    resolveAccess(); if(ROLE==='coach') tab = 'formazione';
    setStatus('Salvato su questo dispositivo');
    subscribeTeam();
  }
}

/* ---------- Logica assegnazioni ---------- */
function slotOf(pid){ const l = S.sheet.lineup; return Object.keys(l).find(k => l[k]===pid); }
function assignSlot(slot, pid){
  const l = S.sheet.lineup;
  const prev = slotOf(pid);
  if(prev) delete l[prev];
  l[slot] = pid;
  S.sheet.bench = S.sheet.bench.filter(b => b !== pid);
  save('sheet');
}
function starters(){ return (FORMATIONS[S.sheet.formation]||[]).map(([s]) => ({slot:s, p:P(S.sheet.lineup[s])})); }
function tokenPlayer(scheme, tok){
  const ov = (S.sheet.overrides[scheme.id]||{})[tok.id];
  if(ov && P(ov)) return {p:P(ov), override:true};
  return {p:P(S.sheet.lineup[tok.slot]), override:false};
}
function roleMap(scheme){
  const m = new Map();
  scheme.tokens.forEach(t => { const r = (t.role||'').trim(); if(r && !m.has(r)) m.set(r, ROLE_COLORS[m.size % ROLE_COLORS.length]); });
  return m;
}
function tokColor(scheme, t, rm){ return rm.get((t.role||'').trim()) || '#15202B'; }
function nameLayout(tokens){
  const out = {}, seen = new Set();
  const close = (a,b) => Math.abs(a.y-b.y) < 1.6 && Math.abs(a.x-b.x) < 5.5;
  tokens.forEach(t0 => {
    if(seen.has(t0.id)) return;
    const cl = [t0]; seen.add(t0.id);
    for(let i=0;i<cl.length;i++) tokens.forEach(o => { if(!seen.has(o.id) && close(cl[i],o)){ seen.add(o.id); cl.push(o); } });
    cl.sort((a,b)=>a.x-b.x);
    cl.forEach((t,i) => {
      const near = cl.filter(o=>o!==t).map(o=>Math.abs(o.x-t.x));
      const d = near.length ? Math.min(...near) : 99;
      out[t.id] = {low: cl.length>1 && i%2===1, span: cl.length>1 ? d*2 : 99};
    });
  });
  return out;
}
function numLabel(p, slot){ return p && p.num ? String(p.num) : (p ? '·' : String(slot)); }

}

const YS = 1.5, VX0 = -25, VX1 = 35, VY0 = -3, VY1 = 31;
function fieldSVG(){
  const g = '#2F6B45', Y = v => v*YS;
  const stripes = Array.from({length:10},(_,i)=>`<rect x="${VX0}" y="${Y(VY0)+i*(VY1-VY0)*YS/10}" width="${VX1-VX0}" height="${(VY1-VY0)*YS/10}" fill="${i%2?'#D8E9DD':'#E3EFE6'}"/>`).join('');
  const a = Math.acos(5.5/9.15);
  const ax1 = -9.15*Math.sin(a), ay = Y(11+9.15*Math.cos(a)), ax2 = 9.15*Math.sin(a);
  return `${stripes}
  <g fill="none" stroke="${g}" stroke-width=".28" stroke-linecap="round">
    <line x1="${VX0}" y1="0" x2="${VX1}" y2="0"/>
    <line x1="34" y1="0" x2="34" y2="${Y(VY1)}"/>
    <rect x="-20.16" y="0" width="40.32" height="${Y(16.5)}"/>
    <rect x="-9.16" y="0" width="18.32" height="${Y(5.5)}"/>
    <rect x="-3.66" y="${Y(-2.2)}" width="7.32" height="${Y(2.2)}"/>
    <path d="M ${ax1} ${ay} A 9.15 ${9.15*YS} 0 0 0 ${ax2} ${ay}"/>
    <path d="M 33 0 A 1 ${YS} 0 0 1 34 ${YS}"/>
  </g>
  <circle cx="0" cy="${Y(11)}" r=".3" fill="${g}"/>`;
}
function ballSVG(b, drag){ return `<g ${drag?'data-ball="1" style="cursor:grab"':''} transform="translate(${b.x} ${b.y*YS})"><circle r="1.15" fill="#fff" stroke="#15202B" stroke-width=".22"/><path d="M0 -.45 L.43 -.14 L.27 .37 L-.27 .37 L-.43 -.14Z" fill="#15202B"/></g>`; }
function schemeThumb(sc){
  const rm = roleMap(sc);
  const dots = sc.tokens.map(t => `<circle cx="${t.x}" cy="${t.y*YS}" r="1.5" fill="${tokColor(sc,t,rm)}" stroke="#fff" stroke-width=".3"/>`).join('');
  return `<svg class="sthumb" viewBox="${VX0} ${VY0*YS} ${VX1-VX0} ${(VY1-VY0)*YS}" role="img" aria-label="Anteprima schema ${esc(sc.name)}">${fieldSVG()}${ballSVG(sc.ball,false)}${dots}</svg>`;
}

}

/* ---------- Canvas: pagine PDF ---------- */
const W = 1188, H = 840, K = 2.5;
const INK = '#15202B', MUTED = '#5B6875', GRASS = '#2F6B45', G1 = '#E3EFE6', G2 = '#D8E9DD', RED = '#C8102E';
function cv(){ const c = document.createElement('canvas'); c.width = W*K; c.height = H*K; const x = c.getContext('2d'); x.scale(K,K); x.fillStyle='#fff'; x.fillRect(0,0,W,H); return [c,x]; }
function font(x, size, weight=600, cond=false){ x.font = `${weight} ${size}px ${cond?'"Barlow Condensed","Arial Narrow",Arial':'"Barlow",Arial'},sans-serif`; }
function T(x, s, px, py, o={}){
  font(x, o.size||14, o.weight||500, o.cond);
  x.fillStyle = o.color||INK; x.textAlign = o.align||'left'; x.textBaseline = o.base||'alphabetic';
  let str = String(s??'');
  if(o.max){ let sz = o.size||14; while(x.measureText(str).width > o.max && sz > 8){ sz -= .5; font(x, sz, o.weight||500, o.cond); } }
  if(o.halo){ x.lineWidth = o.halo; x.strokeStyle = '#fff'; x.lineJoin='round'; x.strokeText(str, px, py); }
  x.fillText(str, px, py);
}
function wrap(x, s, px, py, maxW, lh, o={}, maxLines=99){
  font(x, o.size||14, o.weight||500, o.cond);
  const words = String(s||'').split(/\s+/); let line = '', n = 0;
  for(const para of String(s||'').split('\n')){
    line = '';
    for(const w of para.split(/\s+/)){
      const test = line ? line+' '+w : w;
      if(x.measureText(test).width > maxW && line){ T(x,line,px,py+n*lh,o); n++; line = w; if(n>=maxLines) return n; }
      else line = test;
    }
    T(x,line,px,py+n*lh,o); n++; if(n>=maxLines) return n;
  }
  return n;
}
function header(x, title, sub, page, total){
  const s = S.sheet;
  T(x, title, 36, 70, {size:40, weight:700, cond:true, max:700});
  if(sub) T(x, sub, 36, 98, {size:17, weight:500, color:MUTED, max:700});
  const right = [s.opponent ? `${teamLabel()} contro ${s.opponent}` : teamLabel(),
    [fmtDate(s.date), s.time].filter(Boolean).join(' ore '), [s.venue, s.category].filter(Boolean).join(', ')].filter(Boolean);
  right.forEach((r,i) => T(x, r, W-36, 52+i*22, {size:i?15:19, weight:i?500:700, align:'right', color:i?MUTED:INK, max:400}));
  x.fillStyle = INK; x.fillRect(36, 116, W-72, 3);
  x.fillStyle = GRASS; x.fillRect(36, 116, 90, 3);
  T(x, `${page} / ${total}`, W-36, H-18, {size:12, color:MUTED, align:'right'});
}
function disc(x, cx, cy, r, fill, label, o={}){
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2);
  if(o.hollow){ x.fillStyle='#fff'; x.fill(); x.setLineDash([4,3]); x.lineWidth=2; x.strokeStyle=fill; x.stroke(); x.setLineDash([]); }
  else { x.fillStyle=fill; x.fill(); x.lineWidth=2.5; x.strokeStyle='#fff'; x.stroke(); }
  T(x, label, cx, cy+1, {size:o.size||r*1.05, weight:700, cond:true, align:'center', base:'middle', color:o.hollow?fill:'#fff'});
}

function coverPage(total){
  const [c,x] = cv(); const s = S.sheet;
  header(x, 'Foglio gara', s.opponent ? `Distinta e formazione contro ${s.opponent}` : 'Distinta e formazione', 1, total);
  // Distinta
  const st = starters();
  const bench = s.bench.map(P).filter(Boolean);
  const rows = st.length + bench.length;
  const rh = Math.min(27, (H-150-60-60)/Math.max(rows,1));
  let y = 158;
  const row = (p, slot, isStarter) => {
    x.fillStyle = isStarter ? INK : GRASS;
    x.beginPath(); x.roundRect ? x.roundRect(36, y-rh*0.72, 36, rh*0.86, 5) : x.rect(36,y-rh*0.72,36,rh*0.86); x.fill();
    T(x, p ? (p.num||'–') : '–', 54, y-rh*0.29+1, {size:Math.min(18,rh*0.7), weight:700, cond:true, align:'center', base:'middle', color:'#fff'});
    T(x, p ? p.name : 'Da assegnare', 82, y-rh*0.29+1, {size:Math.min(17,rh*0.66), weight:p?600:500, color:p?INK:MUTED, base:'middle', max:250});
    const tag = p && (p.id===s.captain ? 'K' : p.id===s.vice ? 'VK' : '');
    if(tag){ x.fillStyle = '#E3A008'; x.beginPath(); x.arc(356, y-rh*0.29, 11, 0, 7); x.fill(); T(x, tag, 356, y-rh*0.29+1, {size:tag.length>1?10:13, weight:700, align:'center', base:'middle', color:INK}); }
    y += rh;
  };
  T(x, 'Titolari', 36, 146, {size:21, weight:700, cond:true}); y = 146 + rh + 4;
  st.forEach(({slot,p}) => row(p, slot, true));
  y += 18; T(x, 'Panchina', 36, y, {size:21, weight:700, cond:true}); y += rh + 4;
  if(bench.length) bench.forEach(p => row(p, null, false)); else T(x, 'Nessun giocatore in panchina', 36, y-8, {size:14, color:MUTED});
  // Campo
  const ph = H-150-52, pw = ph*68/105, px = 400 + (440-pw)/2 + 20, py = 146;
  for(let i=0;i<12;i++){ x.fillStyle = i%2?G2:G1; x.fillRect(px, py+i*ph/12, pw, ph/12+0.5); }
  x.strokeStyle = GRASS; x.lineWidth = 2; x.strokeRect(px,py,pw,ph);
  const m = pw/68;
  x.beginPath(); x.moveTo(px,py+ph/2); x.lineTo(px+pw,py+ph/2); x.stroke();
  x.beginPath(); x.arc(px+pw/2, py+ph/2, 9.15*m, 0, 7); x.stroke();
  [[py,1],[py+ph,-1]].forEach(([yy,d]) => {
    x.strokeRect(px+pw/2-20.16*m, d>0?yy:yy-16.5*m, 40.32*m, 16.5*m);
    x.strokeRect(px+pw/2-9.16*m, d>0?yy:yy-5.5*m, 18.32*m, 5.5*m);
  });
  (FORMATIONS[s.formation]||[]).forEach(([n,fx,fy]) => {
    const p = P(s.lineup[n]); const cx = px + fx/100*pw, cy = py + fy/100*ph;
    disc(x, cx, cy, 19, INK, p ? (p.num||n) : n, {hollow:!p, size:21});
    if(p){ T(x, surname(p.name), cx, cy+36, {size:14, weight:700, align:'center', halo:4, max:110}); }
    if(p && (p.id===s.captain||p.id===s.vice)){ const tg = p.id===s.captain?'K':'VK'; x.fillStyle='#E3A008'; x.beginPath(); x.arc(cx+17,cy-15,9,0,7); x.fill(); T(x,tg,cx+17,cy-14,{size:tg.length>1?8:11,weight:700,align:'center',base:'middle'}); }
  });
  // Colonna destra
  const rx = 890;
  T(x, 'Modulo', rx, 150, {size:15, weight:600, color:MUTED});
  T(x, s.formation, rx, 196, {size:50, weight:700, cond:true});
  let ry = 240;
  const cap = P(s.captain), vice = P(s.vice);
  if(cap){ T(x, 'Capitano', rx, ry, {size:14, color:MUTED}); T(x, `${cap.num?cap.num+' ':''}${cap.name}`, rx, ry+22, {size:19, weight:700, max:260}); ry += 52; }
  if(vice){ T(x, 'Vice capitano', rx, ry, {size:14, color:MUTED}); T(x, `${vice.num?vice.num+' ':''}${vice.name}`, rx, ry+22, {size:19, weight:700, max:260}); ry += 52; }
  const sel = s.selected.map(id => S.schemes.find(q => q.id===id)).filter(Boolean);
  if(sel.length){
    ry += 8; T(x, 'Calci piazzati', rx, ry, {size:21, weight:700, cond:true}); ry += 26;
    sel.forEach((q,i) => { if(ry > 600) return; T(x, `p. ${i+2}`, rx, ry, {size:13, color:MUTED}); T(x, q.name + (q.subtitle?`, ${q.subtitle}`:''), rx+42, ry, {size:15, weight:600, max:220}); ry += 22; });
  }
  if(s.notes){
    ry += 16; T(x, 'Note', rx, ry, {size:21, weight:700, cond:true}); ry += 24;
    wrap(x, s.notes, rx, ry, 262, 20, {size:15, weight:500}, Math.max(1, Math.floor((H-50-ry)/20)));
  }
  return c;
}

function schemePage(sc, page, total){
  const [c,x] = cv();
  header(x, sc.name, sc.subtitle, page, total);
  const fav = sc.side==='favore';
  // Campo
  const sx = 12, sy = sx*YS, ox = 36, oy = 140, fw = (VX1-VX0)*sx, fh = (VY1-VY0)*sy;
  const X = v => ox + (v-VX0)*sx, Y = v => oy + (v-VY0)*sy;
  x.save(); x.beginPath(); x.roundRect ? x.roundRect(ox, oy, fw, fh, 8) : x.rect(ox,oy,fw,fh); x.clip();
  for(let i=0;i<10;i++){ x.fillStyle = i%2?G2:G1; x.fillRect(ox, oy+i*fh/10, fw, fh/10+0.5); }
  x.restore();
  x.strokeStyle = GRASS; x.lineWidth = 2.5; x.lineCap='round';
  const L = (a,b,c2,d) => { x.beginPath(); x.moveTo(X(a),Y(b)); x.lineTo(X(c2),Y(d)); x.stroke(); };
  L(VX0,0,VX1,0); L(34,0,34,VY1);
  x.strokeRect(X(-20.16),Y(0),40.32*sx,16.5*sy);
  x.strokeRect(X(-9.16),Y(0),18.32*sx,5.5*sy);
  x.strokeRect(X(-3.66),Y(-2.2),7.32*sx,2.2*sy);
  const a = Math.acos(5.5/9.15);
  x.beginPath(); x.ellipse(X(0),Y(11),9.15*sx,9.15*sy,0, Math.PI/2 - a, Math.PI/2 + a); x.stroke();
  x.beginPath(); x.arc(X(0),Y(11),2.5,0,7); x.fillStyle=GRASS; x.fill();
  x.beginPath(); x.ellipse(X(34),Y(0),sx,sy,0,Math.PI/2,Math.PI); x.stroke();
  // pallone
  const bx2 = X(sc.ball.x), by2 = Y(sc.ball.y), br = 1.15*sx;
  x.beginPath(); x.arc(bx2,by2,br,0,7); x.fillStyle='#fff'; x.fill(); x.lineWidth=2; x.strokeStyle=INK; x.stroke();
  x.beginPath(); for(let i=0;i<5;i++){ const an = -Math.PI/2 + i*2*Math.PI/5; x.lineTo(bx2+Math.cos(an)*br*.42, by2+Math.sin(an)*br*.42); } x.closePath(); x.fillStyle=INK; x.fill();
  // segni
  (sc.marks||[]).forEach(m => T(x, m.text, X(m.x), Y(m.y)+1, {size:24, weight:700, align:'center', base:'middle', color:RED}));
  // pedine
  const rm = roleMap(sc); const r = 1.75*sx; const nl = nameLayout(sc.tokens);
  sc.tokens.forEach(t => {
    const {p} = tokenPlayer(sc, t); const col = tokColor(sc, t, rm);
    disc(x, X(t.x), Y(t.y), r, col, p ? (p.num||t.slot) : t.slot, {hollow:!p, size:21});
    if(t.tag) T(x, t.tag, X(t.x), Y(t.y)-r-7, {size:18, weight:700, align:'center', color:RED, halo:3});
    if(p){ const L2 = nl[t.id]; T(x, surname(p.name), X(t.x), Y(t.y)+r+(L2.low?29:14), {size:12.5, weight:700, align:'center', halo:3.5, max:Math.min(96, L2.span*sx-8)}); }
  });
  // nota e legenda sotto il campo
  let ny = oy + fh + 30;
  if(sc.note) { const n = wrap(x, sc.note, 36, ny, fw, 26, {size:22, weight:700, cond:true}, 3); ny += n*26 + 4; }
  if(sc.legend) T(x, sc.legend, 36, ny, {size:15, weight:500, color:MUTED, max:fw});
  // Pannello compiti
  const rx = 790, rw = W-36-rx;
  x.fillStyle = fav ? '#DDF0E2' : '#F8DDE1';
  x.beginPath(); x.roundRect ? x.roundRect(rx, 140, 110, 30, 15) : x.rect(rx,140,110,30); x.fill();
  T(x, fav ? 'A favore' : 'A sfavore', rx+55, 156, {size:17, weight:700, cond:true, align:'center', base:'middle', color:fav?'#1E5A36':'#8E0C22'});
  const groups = new Map();
  sc.tokens.forEach(t => { const k = (t.role||'').trim() || 'Altri'; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const entries = [...groups.entries()].sort((a,b) => (a[0]==='Altri') - (b[0]==='Altri'));
  const lines = sc.tokens.length + entries.length*1.6;
  const lh = Math.min(26, (H-60-200)/Math.max(lines,1));
  let gy = 206;
  T(x, 'Compiti', rx, 198, {size:24, weight:700, cond:true});
  gy = 232;
  entries.forEach(([role, toks]) => {
    const col = rm.get(role) || INK;
    x.fillStyle = col; x.fillRect(rx, gy-lh*0.55, 5, lh*0.7);
    T(x, role, rx+13, gy, {size:Math.min(19,lh*0.8), weight:700, cond:true, max:rw-13});
    gy += lh;
    toks.slice().sort((a,b)=> (a.tag&&b.tag&&!isNaN(a.tag)&&!isNaN(b.tag)) ? a.tag-b.tag : a.slot-b.slot).forEach(t => {
      const {p, override} = tokenPlayer(sc, t);
      disc(x, rx+24, gy-lh*0.3, Math.min(11, lh*0.42), col, p ? (p.num||t.slot) : t.slot, {hollow:!p, size:Math.min(13, lh*0.5)});
      T(x, p ? p.name : `Ruolo ${t.slot} da assegnare`, rx+44, gy-lh*0.3+1, {size:Math.min(15.5, lh*0.62), weight:p?600:500, color:p?INK:MUTED, base:'middle', max:rw-60});
      if(t.tag) T(x, t.tag, W-36, gy-lh*0.3+1, {size:Math.min(14,lh*.55), weight:700, color:RED, align:'right', base:'middle'});
      gy += lh;
    });
    gy += lh*0.5;
  });
  return c;
}

function makePages(){
  const sel = S.sheet.selected.map(id => S.schemes.find(q => q.id===id)).filter(Boolean);
  const total = 1 + sel.length;
  return [coverPage(total), ...sel.map((q,i) => schemePage(q, i+2, total))];
}
let fontsReady = null;
function ensureFonts(){
  if(!fontsReady) fontsReady = Promise.all(['700 20px "Barlow Condensed"','600 20px "Barlow Condensed"','500 20px "Barlow"','600 20px "Barlow"','700 20px "Barlow"'].map(f => document.fonts.load(f).catch(()=>{}))).catch(()=>{});
  return fontsReady;
}
async function buildPreview(){
  await ensureFonts();
  const box = $('#pages'); if(!box) return;
  box.innerHTML = '';
  makePages().forEach((c,i) => { c.setAttribute('aria-label', `Pagina ${i+1}`); box.appendChild(c); });
}
async function downloadPdf(){
  if(!downloads) return;
  if(!window.jspdf){ setStatus('Libreria PDF non caricata'); return; }
  setStatus('Creo il PDF…');
  await ensureFonts();
  const pages = makePages();
  const doc = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4', compress:true});
  pages.forEach((c,i) => { if(i) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210); });
  const s = S.sheet;
  const name = [fmtDate(s.date).replace(/\//g,'_'), s.opponent ? s.opponent.replace(/[^\w]+/g,'_').toUpperCase() : '', 'FOGLIO_GARA'].filter(Boolean).join('_') + '.pdf';
  try{ await downloads.save({filename:name, data:doc.output('blob')}); setStatus('PDF pronto'); }
  catch(e){ setStatus(e && e.code==='declined' ? 'Download annullato' : 'Download non riuscito'); }
}

/* ---------- Eventi ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-drop-slot], [data-drop-token], [data-move-token]');
  if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; selectedPlayer = null; if(tab!=='piazzati') openSchemeId = null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.player !== undefined) return; // gestito dal drag
  const act = t.dataset.act;
  const ADMIN_ONLY = ['padd','bulk','newscheme','addtok','deltok','dupscheme','delscheme','teamadd'];
  if(!isAdmin() && (ADMIN_ONLY.includes(act) || t.dataset.pdel || t.dataset.up || t.dataset.down || t.dataset.mode==='move' || t.dataset.teamdel || t.dataset.teamcode)) return;
  if(t.dataset.teamgo){ curTeam = t.dataset.teamgo; tab = 'rosa'; subscribeTeam(); return; }
  if(t.dataset.teamas){ switchView('coach', t.dataset.teamas); return; }
  if(t.dataset.teamcode){ const tm = S.teams.find(x=>x.id===t.dataset.teamcode); if(tm){ tm.code = genCode(); save('teams'); render(); } return; }
  if(t.dataset.teamdel){ const tm = S.teams.find(x=>x.id===t.dataset.teamdel); if(tm && confirm(`Eliminare la squadra "${tm.name}"? Rosa e formazione non saranno più accessibili.`)){ S.teams = S.teams.filter(x=>x!==tm); save('teams'); if(curTeam===tm.id){ curTeam = S.teams[0]?.id||null; subscribeTeam(); } else render(); } return; }
  if(t.dataset.pdel){ const id=t.dataset.pdel; S.players = S.players.filter(p=>p.id!==id); const l=S.sheet.lineup; Object.keys(l).forEach(k=>{if(l[k]===id) delete l[k]}); S.sheet.bench=S.sheet.bench.filter(b=>b!==id); save('roster'); save('sheet'); render(); return; }
  if(t.dataset.clearSlot){ e.stopPropagation(); delete S.sheet.lineup[t.dataset.clearSlot]; save('sheet'); render(); return; }
  if(t.dataset.dropSlot){ if(selectedPlayer){ assignSlot(t.dataset.dropSlot, selectedPlayer); selectedPlayer=null; render(); } return; }
  if(t.dataset.dropToken){ if(selectedPlayer){ const ov = S.sheet.overrides[openSchemeId] ||= {}; ov[t.dataset.dropToken]=selectedPlayer; selectedPlayer=null; save('sheet'); render(); } return; }
  if(t.dataset.bench){ const id=t.dataset.bench; const b=S.sheet.bench; S.sheet.bench = b.includes(id) ? b.filter(x=>x!==id) : [...b,id]; save('sheet'); render(); return; }
  if(t.dataset.schemecard){ const id=t.dataset.schemecard; const order=S.schemes.map(q=>q.id); let s=S.sheet.selected.filter(i=>i!==id); if(!S.sheet.selected.includes(id)) s.push(id); S.sheet.selected = s.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); save('sheet'); render(); return; }
  if(t.dataset.open){ openSchemeId=t.dataset.open; moveMode = !!t.dataset.editmode && isAdmin(); selectedToken=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.up || t.dataset.down){ const i=+(t.dataset.up??t.dataset.down), j=t.dataset.up!==undefined?i-1:i+1; if(j<0||j>=S.schemes.length) return; [S.schemes[i],S.schemes[j]]=[S.schemes[j],S.schemes[i]]; const order=S.schemes.map(q=>q.id); S.sheet.selected.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); save('schemes'); save('sheet'); render(); return; }
  if(t.dataset.mode){ moveMode = t.dataset.mode==='move'; selectedToken=null; selectedPlayer=null; render(); return; }
  const sc = S.schemes.find(q=>q.id===openSchemeId);
  switch(act){
    case 'teamadd': { const tm = {id:uid('t_'), name:'Nuova squadra', category:'', coach:'', code:genCode()}; S.teams.push(tm); save('teams'); if(!curTeam){ curTeam = tm.id; subscribeTeam(); } else render(); break; }
    case 'padd': S.players.push({id:uid('p'), num:'', name:''}); save('roster'); render(); const ins=document.querySelectorAll('[data-pnum]'); ins[ins.length-1]?.focus(); break;
    case 'bulk': {
      const lines = ($('#bulk').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
      lines.forEach(l => { const m = l.match(/^(\d{1,3})\s*[-.)]?\s*(.+)$/); S.players.push({id:uid('p'), num:m?m[1]:'', name:(m?m[2]:l).trim()}); });
      S.players.sort((a,b)=>(+a.num||999)-(+b.num||999)); save('roster'); render(); break; }
    case 'newmatch': if(confirm('Svuotare formazione, panchina e dati partita? Rosa e schemi restano.')){ const keep = S.sheet.selected; S.sheet = defaultSheet(); S.sheet.selected = keep; save('sheet'); render(); } break;
    case 'newscheme': {
      const b = BASES[$('#base').value];
      const tokens = Array.from({length:11},(_,i)=>({id:uid('t'), slot:i+1, x:-22+i*4.5, y:28, role:'', tag:''}));
      const q = {id:uid('s'), name:b.name, subtitle:'', side:b.side, note:'', legend:'', ball:{...b.ball}, tokens, marks:[]};
      S.schemes.push(q); S.sheet.selected.push(q.id); save('schemes'); save('sheet'); openSchemeId=q.id; moveMode=true; render(); break; }
    case 'back': openSchemeId=null; selectedToken=null; render(); break;
    case 'addtok': if(sc){ const n={id:uid('t'), slot:1, x:0, y:30, role:'', tag:''}; sc.tokens.push(n); selectedToken=n.id; save('schemes'); render(); } break;
    case 'deltok': if(sc){ sc.tokens = sc.tokens.filter(q=>q.id!==selectedToken); selectedToken=null; save('schemes'); render(); } break;
    case 'resetov': if(sc){ delete S.sheet.overrides[sc.id]; save('sheet'); render(); } break;
    case 'dupscheme': if(sc){ const q = clone(sc); q.id=uid('s'); q.name = sc.name+' (copia)'; q.tokens.forEach(t=>t.id=uid('t')); S.schemes.splice(S.schemes.indexOf(sc)+1,0,q); save('schemes'); openSchemeId=q.id; render(); } break;
    case 'delscheme': if(sc && confirm(`Eliminare lo schema "${sc.name}"?`)){ S.schemes = S.schemes.filter(q=>q!==sc); S.sheet.selected = S.sheet.selected.filter(i=>i!==sc.id); delete S.sheet.overrides[sc.id]; save('schemes'); save('sheet'); openSchemeId=null; render(); } break;
    case 'refresh': buildPreview(); break;
    case 'download': downloadPdf(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(!isAdmin() && (t.dataset.pnum || t.dataset.pname || t.dataset.sc || t.dataset.tok || t.dataset.team)) return;
  if(t.dataset.team){ const tm = S.teams.find(x=>x.id===t.dataset.team); if(tm){ tm[t.dataset.tf] = t.value; save('teams'); if(t.dataset.tf==='name'){ const h = t.closest('.teamcard')?.querySelector('.hd strong'); if(h) h.textContent = t.value || 'Senza nome'; } } return; }
  if(t.dataset.pnum){ const p=P(t.dataset.pnum); if(p){ p.num=t.value.replace(/\D/g,'').slice(0,3); t.classList.toggle('missing',!p.num); save('roster'); } }
  else if(t.dataset.pname){ const p=P(t.dataset.pname); if(p){ p.name=t.value; save('roster'); } }
  else if(t.dataset.sheet && t.tagName!=='SELECT'){ S.sheet[t.dataset.sheet]=t.value; save('sheet'); if(['team','opponent','date'].includes(t.dataset.sheet)) $('#matchline').textContent = (S.sheet.opponent?`${teamLabel()} contro ${S.sheet.opponent}`:'Nuova partita') + (S.sheet.date?`, ${fmtDate(S.sheet.date)}`:''); }
  else if(t.dataset.sc && t.tagName!=='SELECT'){ const sc=S.schemes.find(q=>q.id===openSchemeId); if(sc){ sc[t.dataset.sc]=t.value; save('schemes'); } }
  else if(t.dataset.tok && t.tagName!=='SELECT'){ const sc=S.schemes.find(q=>q.id===openSchemeId); const tk=sc?.tokens.find(q=>q.id===selectedToken); if(tk){ tk[t.dataset.tok]=t.value; save('schemes'); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.asview){ const v = t.value; if(v==='admin') switchView('admin'); else switchView('coach', v.split(':')[1]); return; }
  if(t.dataset.curteam){ curTeam = t.value; openSchemeId = null; subscribeTeam(); return; }
  if(t.dataset.team && t.dataset.tf==='name'){ render(); return; }
  if(!isAdmin() && (t.dataset.sc || (t.dataset.tok))) return;
  if(t.dataset.sheet && t.tagName==='SELECT'){ S.sheet[t.dataset.sheet]=t.value; save('sheet'); render(); }
  else if(t.dataset.sc && t.tagName==='SELECT'){ const sc=S.schemes.find(q=>q.id===openSchemeId); if(sc){ sc[t.dataset.sc]=t.value; save('schemes'); } }
  else if(t.dataset.tok==='slot'){ const sc=S.schemes.find(q=>q.id===openSchemeId); const tk=sc?.tokens.find(q=>q.id===selectedToken); if(tk){ tk.slot=+t.value; save('schemes'); render(); } }
  else if(t.dataset.tok==='role'){ render(); }
});

/* Drag giocatori (mouse e touch) */
let dnd = null;
document.addEventListener('pointerdown', e => {
  const chipEl = e.target.closest('[data-player]');
  if(chipEl){ dnd = {pid:chipEl.dataset.player, x:e.clientX, y:e.clientY, started:false, el:chipEl}; return; }
  const tokEl = e.target.closest('[data-move-token],[data-ball]');
  if(tokEl && moveMode && isAdmin()){
    const svg = $('#board'); const sc = S.schemes.find(q=>q.id===openSchemeId); if(!svg||!sc) return;
    const isBall = !!tokEl.dataset.ball; const tk = isBall ? sc.ball : sc.tokens.find(q=>q.id===tokEl.dataset.moveToken);
    if(!isBall){ selectedToken = tk.id; }
    tokEl.setPointerCapture?.(e.pointerId);
    const toLocal = ev => { const pt = svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
    let moved = false;
    const mv = ev => { const p = toLocal(ev); tk.x = Math.max(VX0+1, Math.min(VX1-.5, +p.x.toFixed(2))); tk.y = Math.max(VY0+.5, Math.min(VY1-1, +(p.y/YS).toFixed(2))); tokEl.setAttribute('transform', `translate(${tk.x} ${tk.y*YS})`); moved = true; };
    const up = () => { tokEl.removeEventListener('pointermove', mv); tokEl.removeEventListener('pointerup', up); tokEl.removeEventListener('pointercancel', up); if(moved) save('schemes'); render(); };
    tokEl.addEventListener('pointermove', mv); tokEl.addEventListener('pointerup', up); tokEl.addEventListener('pointercancel', up);
    e.preventDefault();
  }
});
document.addEventListener('pointermove', e => {
  if(!dnd) return;
  if(!dnd.started && Math.hypot(e.clientX-dnd.x, e.clientY-dnd.y) > 8){
    dnd.started = true; dnd.ghost = dnd.el.cloneNode(true); dnd.ghost.classList.add('ghost-chip'); document.body.appendChild(dnd.ghost);
  }
  if(dnd.started){
    dnd.ghost.style.left = e.clientX+'px'; dnd.ghost.style.top = e.clientY+'px';
    document.querySelectorAll('.slot.hot').forEach(s=>s.classList.remove('hot'));
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop-slot]'); if(under) under.classList.add('hot');
  }
});
document.addEventListener('pointerup', e => {
  if(!dnd) return;
  const d = dnd; dnd = null;
  if(d.started){
    d.ghost.remove();
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under?.closest('[data-drop-slot]'), tok = under?.closest('[data-drop-token]');
    if(slot) assignSlot(slot.dataset.dropSlot, d.pid);
    else if(tok){ const ov = S.sheet.overrides[openSchemeId] ||= {}; ov[tok.dataset.dropToken] = d.pid; save('sheet'); }
    selectedPlayer = null; render();
  } else {
    selectedPlayer = selectedPlayer===d.pid ? null : d.pid; render();
  }
});
document.addEventListener('pointercancel', () => { if(dnd?.ghost) dnd.ghost.remove(); dnd = null; });

render();
ensureFonts();
initStore();
</script>
